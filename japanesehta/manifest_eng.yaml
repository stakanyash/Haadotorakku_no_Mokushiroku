# unique service name
name: japanesehta
language: eng
installment: exmachina
# required human readable info
display_name: Haadotorakku no Mokushiroku
version: "1.1"
build: "251025b"
description: 'Auto-translate Hard Truck Apocalypse into Japanese. The text in the game is written using the «Romaji» style.


Thanks to EmerEh for the narrator voiceover.'
  
authors: stakan

# optional human readable info
release_date: "20.09.2024"
language: eng
link: https://github.com/ksh1vn/Haadotorakku_no_Mokushiroku
trailer_url: https://www.youtube.com/watch?v=50SPVP-QQac
change_log: assets/changelog_eng.md
logo: assets/HnM_logo.png
install_banner: assets/HnM_banner.png
tags: [audio, visual, humor]

options_base_dir: options

# installator compatibility
patcher_version_requirement: "2.2.1"
compatible_minor_versions: true

# community patch requirements
prerequisites:
  - name: community_remaster
    versions:
      - ">=1.14.1"
    optional_content:
     - hd_gun_models
     - hd_vehicle_models
     - ost_remaster

optional_content:
  - name: oldost
    display_name: "Old OST version Haadotorakku no Mokushiroku"
    description: "Restores the old OST that was used before version 1.1"
    default_option: skip